<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Digital</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<div class="amb amb-1"></div>
<div class="amb amb-2"></div>

<header>
    <div class="eyebrow">Calculadora Online Gratuita</div>
    <h1>Cálculo <em>Digital</em></h1>
    <p>Digite o cálculo desejado</p>
</header>

<div class="card">

    <div class="input-group">
        <label>Primeiro Número</label>
        <input type="number" id="num1" placeholder="0">
    </div>

    <div class="divider">operação</div>

    <div class="input-group">
        <label>Segundo Número</label>
        <input type="number" id="num2" placeholder="0">
    </div>

    <div class="btn-grid">
        <button class="btn btn-op" onclick="calcular('+')">+ Somar</button>
        <button class="btn btn-op" onclick="calcular('-')">− Subtrair</button>
        <button class="btn btn-op" onclick="calcular('*')">× Multiplicar</button>
        <button class="btn btn-op" onclick="calcular('/')">÷ Dividir</button>
        <button class="btn btn-clear" onclick="limpar()">✕ Limpar</button>
    </div>

    <div class="result-box">
        <span class="result-label">Resultado</span>
        <div class="result-value" id="resultado">—</div>
    </div>

</div>

<footer>
    © 2026 Ana Caroline Santos — Cálculo Online
</footer>

<script>
function calcular(operacao) {
    const a = Number(document.getElementById("num1").value);
    const b = Number(document.getElementById("num2").value);

    if (isNaN(a) || isNaN(b)) {
        mostrarErro("Digite valores válidos.");
        return;
    }

    let resultado;

    switch (operacao) {
        case '+':
            resultado = a + b;
            break;
        case '-':
            resultado = a - b;
            break;
        case '*':
            resultado = a * b;
            break;
        case '/':
            if (b === 0) {
                mostrarErro("Não pode dividir por zero.");
                return;
            }
            resultado = a / b;
            break;
    }

    const res = document.getElementById("resultado");
    res.className = "result-value";
    res.textContent = resultado.toLocaleString("pt-BR", { maximumFractionDigits: 10 });
}

function limpar() {
    document.getElementById("num1").value = "";
    document.getElementById("num2").value = "";
    document.getElementById("resultado").className = "result-value";
    document.getElementById("resultado").textContent = "—";
}

function mostrarErro(msg) {
    const res = document.getElementById("resultado");
    res.className = "result-value error";
    res.textContent = msg;
}
</script>

</body>
</html>
